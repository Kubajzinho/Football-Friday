<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#2563eb" />
  <title>Friday Football</title>

  <!-- Ošetření chyb - Zabrání černé obrazovce, pokud spadne JS -->
  <script>
    window.onerror = function(msg, url, line) {
      document.addEventListener('DOMContentLoaded', function() {
        document.body.innerHTML = '<div style="color:#ef4444; padding:20px; font-family:sans-serif; text-align:center; margin-top:50px;">' +
          '<h2 style="font-weight:bold; font-size:24px; margin-bottom:10px;">Aplikaci se nepodařilo spustit</h2>' +
          '<p>Pravděpodobně došlo k chybě při stahování Reactu nebo ikon z internetu (CDN).</p>' +
          '<p style="font-family:monospace; margin-top:20px; color:#fca5a5;">' + msg + ' (řádek ' + line + ')</p>' +
          '</div>';
      });
    };
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel pro překlad JSX v prohlížeči -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons (Opravená UMD verze pro prohlížeč) -->
  <script src="https://unpkg.com/lucide-react@0.344.0/dist/umd/lucide-react.min.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select, button { user-select: auto; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  
  <div id="root">
    <!-- Tento text zmizí, jakmile se načte React. Zabraňuje pocitu černé obrazovky. -->
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; color:#64748b; font-family:sans-serif; flex-direction:column; gap:10px;">
      <svg style="animation: spin 1s linear infinite; width:40px; height:40px; color:#2563eb;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
      <p>Načítání fotbálku...</p>
    </div>
  </div>

  <script type="text/babel">
    if (!window.React || !window.lucideReact) {
      throw new Error("Knihovny se nenačetly. Zkontrolujte připojení k internetu.");
    }

    const { useState, useEffect, useRef } = React;
    
    // Správné rozbalení ikon z UMD objektu
    const { 
      Users, Plus, Trash2, Shuffle, Trophy, Clock, 
      Play, Pause, RotateCcw, CheckCircle2, Share2, 
      Volume2, VolumeX, Timer, Hourglass, Sun, Moon, 
      Send, X, Calendar 
    } = window.lucideReact;

    // --- Zvukový engine ---
    class SoundEffects {
      constructor() { this.audioCtx = null; }
      getContext() {
        if (!this.audioCtx) {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (AudioCtxClass) this.audioCtx = new AudioCtxClass();
        }
        if (this.audioCtx && this.audioCtx.state === 'suspended') this.audioCtx.resume().catch(() => {});
        return this.audioCtx;
      }
      playWhistle() {
        try {
          const ctx = this.getContext();
          if (!ctx) return;
          const playBurst = (startTime, duration) => {
            const osc1 = ctx.createOscillator(), osc2 = ctx.createOscillator();
            const gain = ctx.createGain(), lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
            lfo.frequency.setValueAtTime(32, startTime);
            lfoGain.gain.setValueAtTime(60, startTime);
            lfo.connect(osc1.frequency); lfo.connect(osc2.frequency);
            osc1.type = 'sine'; osc2.type = 'triangle';
            osc1.frequency.setValueAtTime(2450, startTime);
            osc2.frequency.setValueAtTime(2750, startTime);
            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.35, startTime + 0.04);
            gain.gain.setValueAtTime(0.35, startTime + duration - 0.05);
            gain.gain.linearRampToValueAtTime(0, startTime + duration);
            osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
            lfo.start(startTime); osc1.start(startTime); osc2.start(startTime);
            lfo.stop(startTime + duration); osc1.stop(startTime + duration); osc2.stop(startTime + duration);
          };
          playBurst(ctx.currentTime, 0.18);
          playBurst(ctx.currentTime + 0.26, 0.18);
          playBurst(ctx.currentTime + 0.52, 0.55);
          if (navigator.vibrate) try { navigator.vibrate([200, 80, 200, 80, 500]); } catch (e) {}
        } catch (err) {}
      }
      playBeep(isHigh = false) {
        try {
          const ctx = this.getContext();
          if (!ctx) return;
          const now = ctx.currentTime, osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.type = 'sine'; osc.frequency.setValueAtTime(isHigh ? 1200 : 800, now);
          gain.gain.setValueAtTime(0, now);
          gain.gain.linearRampToValueAtTime(0.2, now + 0.02);
          gain.gain.linearRampToValueAtTime(0, now + 0.12);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now); osc.stop(now + 0.13);
        } catch (err) {}
      }
    }
    const sound = new SoundEffects();

    // --- Výchozí data ---
    const INITIAL_PLAYERS = [
      { id: 'p-1', name: 'Petr', rating: 4.5, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } },
      { id: 'p-2', name: 'Honza', rating: 4.0, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } },
      { id: 'p-3', name: 'Michal', rating: 3.5, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } },
      { id: 'p-4', name: 'Tomáš', rating: 3.5, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } },
      { id: 'p-5', name: 'David', rating: 3.0, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } },
      { id: 'p-6', name: 'Lukáš', rating: 3.0, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } },
      { id: 'p-7', name: 'Martin', rating: 2.5, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } },
      { id: 'p-8', name: 'Jakub', rating: 2.5, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } },
      { id: 'p-9', name: 'Ondra', rating: 2.0, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } },
      { id: 'p-10', name: 'Filip', rating: 2.0, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 } }
    ];

    function calculateWinrate(stats) {
      if (!stats || stats.matches === 0) return 0;
      return Math.round((stats.wins / stats.matches) * 100);
    }

    function balanceTeams(players, numTeams) {
      const active = [...players.filter(p => p.active)].sort((a, b) => b.rating - a.rating);
      const names = ['Tým A (Modří)', 'Tým B (Červení)', 'Tým C (Zelení)'];
      const teams = Array.from({ length: numTeams }, (_, i) => ({ id: `team-${i+1}`, name: names[i], players: [], totalRating: 0 }));
      active.forEach(player => {
        teams.sort((a, b) => (a.players.length !== b.players.length) ? a.players.length - b.players.length : a.totalRating - b.totalRating);
        teams[0].players.push(player);
        teams[0].totalRating = Number((teams[0].totalRating + player.rating).toFixed(1));
      });
      return teams;
    }

    function createInitialMatches(teams) {
      const nowIso = new Date().toISOString();
      if (teams.length === 2) {
        return [{
          id: `match-1-${Date.now()}`, matchNumber: 1,
          teamAId: teams[0].id, teamAName: teams[0].name, teamBId: teams[1].id, teamBName: teams[1].name,
          teamAScore: 0, teamBScore: 0, status: 'in_progress', kickoffAt: nowIso,
          teamAPlayerIds: teams[0].players.map(p => p.id), teamBPlayerIds: teams[1].players.map(p => p.id),
        }];
      }
      if (teams.length === 3) {
        return [
          { id: `match-1-${Date.now()}`, matchNumber: 1, teamAId: teams[0].id, teamAName: teams[0].name, teamBId: teams[1].id, teamBName: teams[1].name, teamAScore: 0, teamBScore: 0, status: 'in_progress', restingTeamName: teams[2].name, kickoffAt: nowIso, teamAPlayerIds: teams[0].players.map(p => p.id), teamBPlayerIds: teams[1].players.map(p => p.id) },
          { id: `match-2-${Date.now()}`, matchNumber: 2, teamAId: teams[1].id, teamAName: teams[1].name, teamBId: teams[2].id, teamBName: teams[2].name, teamAScore: 0, teamBScore: 0, status: 'upcoming', restingTeamName: teams[0].name, teamAPlayerIds: teams[1].players.map(p => p.id), teamBPlayerIds: teams[2].players.map(p => p.id) },
          { id: `match-3-${Date.now()}`, matchNumber: 3, teamAId: teams[0].id, teamAName: teams[0].name, teamBId: teams[2].id, teamBName: teams[2].name, teamAScore: 0, teamBScore: 0, status: 'upcoming', restingTeamName: teams[1].name, teamAPlayerIds: teams[0].players.map(p => p.id), teamBPlayerIds: teams[2].players.map(p => p.id) }
        ];
      }
      return [];
    }

    // --- Hlavní Aplikace ---
    function App() {
      const [darkMode, setDarkMode] = useState(true);
      const [activeTab, setActiveTab] = useState('players');
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [copiedShare, setCopiedShare] = useState(false);

      const [players, setPlayers] = useState(() => {
        try { const s = localStorage.getItem('ff_players'); return s ? JSON.parse(s) : INITIAL_PLAYERS; } catch(e) { return INITIAL_PLAYERS; }
      });
      const [name, setName] = useState('');
      const [rating, setRating] = useState(3.0);
      const [numTeams, setNumTeams] = useState(2);
      const [teams, setTeams] = useState(() => {
        try { const s = localStorage.getItem('ff_teams'); return s ? JSON.parse(s) : []; } catch(e) { return []; }
      });
      const [matches, setMatches] = useState(() => {
        try { const s = localStorage.getItem('ff_matches'); return s ? JSON.parse(s) : []; } catch(e) { return []; }
      });

      // Časomíra
      const [timerMode, setTimerMode] = useState('countdown');
      const [timeLeft, setTimeLeft] = useState(240);
      const [secondsElapsed, setSecondsElapsed] = useState(0);
      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [hasWhistled, setHasWhistled] = useState(false);
      const wakeLockRef = useRef(null);

      // Zápis do LocalStorage
      useEffect(() => { localStorage.setItem('ff_players', JSON.stringify(players)); }, [players]);
      useEffect(() => { localStorage.setItem('ff_teams', JSON.stringify(teams)); }, [teams]);
      useEffect(() => { localStorage.setItem('ff_matches', JSON.stringify(matches)); }, [matches]);

      // Správa WakeLock a Dark Mode
      useEffect(() => { document.body.className = `${darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-100 text-slate-900'} min-h-screen`; }, [darkMode]);
      useEffect(() => {
        async function reqWake() {
          if ('wakeLock' in navigator && isTimerRunning) {
            try { wakeLockRef.current = await navigator.wakeLock.request('screen'); } catch(e) {}
          }
        }
        if (isTimerRunning) reqWake();
        else if (wakeLockRef.current) { wakeLockRef.current.release().catch(()=>{}); wakeLockRef.current = null; }
        return () => { if (wakeLockRef.current) wakeLockRef.current.release().catch(()=>{}); };
      }, [isTimerRunning]);

      // Časovač tick
      useEffect(() => {
        let interval = null;
        if (isTimerRunning) {
          interval = setInterval(() => {
            setSecondsElapsed(prev => prev + 1);
            if (timerMode === 'countdown') {
              setTimeLeft(prev => {
                if (prev <= 1) {
                  if (!hasWhistled && soundEnabled) { sound.playWhistle(); setHasWhistled(true); }
                  return 0;
                }
                if (prev <= 4 && prev > 1 && soundEnabled) sound.playBeep(false);
                return prev - 1;
              });
            }
          }, 1000);
        }
        return () => { if (interval) clearInterval(interval); };
      }, [isTimerRunning, timerMode, soundEnabled, hasWhistled]);

      const formatTime = (totalSec) => `${Math.floor(totalSec / 60).toString().padStart(2,'0')}:${(totalSec % 60).toString().padStart(2,'0')}`;
      const formatDateTime = (isoString) => {
        if (!isoString) return '';
        try {
          const d = new Date(isoString);
          return `${d.getDate()}.${d.getMonth() + 1}. ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        } catch(e) { return ''; }
      };

      const handleGenerate = () => {
        const active = players.filter(p => p.active);
        if (active.length < numTeams * 2) return alert(`Potřebujete alespoň ${numTeams * 2} aktivních hráčů!`);
        const gTeams = balanceTeams(players, numTeams);
        setTeams(gTeams); setMatches(createInitialMatches(gTeams)); setActiveTab('generator');
      };

      const activeMatch = matches.find(m => m.status === 'in_progress') || matches.find(m => m.status === 'upcoming');

      const handleFinishMatch = (matchId) => {
        const match = matches.find(m => m.id === matchId);
        if (!match) return;
        const nowIso = new Date().toISOString();
        const finishedMatch = { ...match, status: 'finished', kickoffAt: match.kickoffAt || nowIso, finishedAt: nowIso, durationSeconds: secondsElapsed > 0 ? secondsElapsed : 240 };
        const isDraw = finishedMatch.teamAScore === finishedMatch.teamBScore;
        const aWon = finishedMatch.teamAScore > finishedMatch.teamBScore;

        setPlayers(prev => prev.map(p => {
          const inA = finishedMatch.teamAPlayerIds.includes(p.id) || finishedMatch.teamAPlayerIds.includes(p.name);
          const inB = finishedMatch.teamBPlayerIds.includes(p.id) || finishedMatch.teamBPlayerIds.includes(p.name);
          if (!inA && !inB) return p;
          const st = p.stats || { matches: 0, wins: 0, draws: 0, losses: 0, goalsFor: 0, goalsAgainst: 0 };
          const isWinner = (inA && aWon) || (inB && !aWon && !isDraw);
          const isLoser = (inA && !aWon && !isDraw) || (inB && aWon);
          return {
            ...p,
            stats: {
              matches: st.matches + 1, wins: st.wins + (isWinner ? 1 : 0), draws: st.draws + (isDraw ? 1 : 0), losses: st.losses + (isLoser ? 1 : 0),
              goalsFor: (st.goalsFor || 0) + (inA ? finishedMatch.teamAScore : finishedMatch.teamBScore),
              goalsAgainst: (st.goalsAgainst || 0) + (inA ? finishedMatch.teamBScore : finishedMatch.teamAScore),
            }
          };
        }));
        setMatches(prev => {
          const updated = prev.map(m => m.id === matchId ? finishedMatch : m);
          const nextUpcoming = updated.find(m => m.status === 'upcoming');
          if (nextUpcoming) return updated.map(m => m.id === nextUpcoming.id ? { ...m, status: 'in_progress', kickoffAt: nowIso } : m);
          return updated;
        });
        setTimeLeft(240); setSecondsElapsed(0); setIsTimerRunning(false); setHasWhistled(false);
      };

      return (
        <div className="py-6 px-3 sm:px-6">
          <div className="max-w-4xl mx-auto space-y-4">
            
            {/* HLAVIČKA */}
            <header className={`rounded-2xl border p-4 flex items-center justify-between ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
              <div className="flex items-center gap-3">
                <span className="text-3xl">⚽</span>
                <h1 className="text-xl font-bold">Friday Football</h1>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setIsShareModalOpen(true)} className="px-3 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs flex items-center gap-1.5 cursor-pointer">
                  <Share2 className="w-3.5 h-3.5" /> Sdílet
                </button>
                <button onClick={() => setDarkMode(!darkMode)} className={`p-2 rounded-xl border cursor-pointer ${darkMode ? 'bg-slate-800 border-slate-700 text-amber-400' : 'bg-slate-100 border-slate-200 text-slate-600'}`}>
                  {darkMode ? <Sun className="w-4 h-4" /> : <Moon className="w-4 h-4" />}
                </button>
              </div>
            </header>

            {/* NAVIGACE */}
            <nav className={`p-1.5 rounded-2xl border flex gap-1 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
              <button onClick={() => setActiveTab('players')} className={`flex-1 py-2.5 rounded-xl font-semibold text-xs sm:text-sm flex items-center justify-center gap-1.5 cursor-pointer ${activeTab === 'players' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <Users className="w-4 h-4" /> Hráči ({players.filter(p => p.active).length})
              </button>
              <button onClick={() => setActiveTab('generator')} className={`flex-1 py-2.5 rounded-xl font-semibold text-xs sm:text-sm flex items-center justify-center gap-1.5 cursor-pointer ${activeTab === 'generator' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <Shuffle className="w-4 h-4" /> Týmy
              </button>
              <button onClick={() => setActiveTab('matches')} className={`flex-1 py-2.5 rounded-xl font-semibold text-xs sm:text-sm flex items-center justify-center gap-1.5 cursor-pointer ${activeTab === 'matches' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <Clock className="w-4 h-4" /> Zápas & Čas
              </button>
              <button onClick={() => setActiveTab('stats')} className={`flex-1 py-2.5 rounded-xl font-semibold text-xs sm:text-sm flex items-center justify-center gap-1.5 cursor-pointer ${activeTab === 'stats' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}>
                <Trophy className="w-4 h-4" /> Tabulka
              </button>
            </nav>

            {/* TAB: HRÁČI */}
            {activeTab === 'players' && (
              <section className={`rounded-2xl border p-5 space-y-4 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <form onSubmit={e => { e.preventDefault(); if (name.trim()) { setPlayers([...players, { id: `p-${Date.now()}`, name: name.trim(), rating, active: true, stats: { matches: 0, wins: 0, draws: 0, losses: 0 } }]); setName(''); } }} className="flex flex-col sm:flex-row gap-2">
                  <input type="text" placeholder="Jméno hráče..." value={name} onChange={e => setName(e.target.value)} className={`flex-1 px-3 py-2 rounded-xl border text-sm ${darkMode ? 'bg-slate-950 border-slate-700 text-white' : 'bg-white border-slate-300'}`} />
                  <div className="flex gap-2">
                    <select value={rating} onChange={e => setRating(Number(e.target.value))} className={`px-3 py-2 rounded-xl border text-sm font-semibold cursor-pointer ${darkMode ? 'bg-slate-950 border-slate-700 text-white' : 'bg-white border-slate-300'}`}>
                      {[0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5].map(r => <option key={r} value={r}>⭐ {r.toFixed(1)}</option>)}
                    </select>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-semibold flex items-center gap-1">
                      <Plus className="w-4 h-4" /> Přidat
                    </button>
                  </div>
                </form>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {players.map(p => (
                    <div key={p.id} className={`p-3 rounded-xl border flex items-center justify-between ${p.active ? (darkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200') : 'opacity-40 bg-slate-900'}`}>
                      <div className="flex items-center gap-2.5">
                        <input type="checkbox" checked={p.active} onChange={() => setPlayers(players.map(x => x.id === p.id ? { ...x, active: !x.active } : x))} className="w-4 h-4 text-blue-600 rounded cursor-pointer" />
                        <span className="font-semibold text-sm">{p.name}</span>
                        <span className="text-xs px-2 py-0.5 rounded-full font-mono bg-slate-800 text-amber-400">⭐ {p.rating.toFixed(1)}</span>
                      </div>
                      <button onClick={() => setPlayers(players.filter(x => x.id !== p.id))} className="p-1.5 text-slate-500 hover:text-red-400 cursor-pointer">
                        <Trash2 className="w-4 h-4" />
                      </button>
                    </div>
                  ))}
                </div>

                <div className="pt-4 border-t border-slate-800 flex flex-col sm:flex-row justify-between gap-3">
                  <div className="flex items-center gap-2 text-sm">
                    <button onClick={() => setNumTeams(2)} className={`px-3 py-1 rounded-lg text-xs font-bold ${numTeams === 2 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>2 Týmy</button>
                    <button onClick={() => setNumTeams(3)} className={`px-3 py-1 rounded-lg text-xs font-bold ${numTeams === 3 ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}`}>3 Týmy</button>
                  </div>
                  <button onClick={handleGenerate} className="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-bold text-sm flex justify-center gap-2">
                    <Shuffle className="w-4 h-4" /> Vylosovat vyvážené týmy
                  </button>
                </div>
              </section>
            )}

            {/* TAB: TÝMY */}
            {activeTab === 'generator' && (
              <section className="space-y-3">
                {teams.length === 0 ? (
                  <div className="p-8 text-center rounded-2xl border border-slate-800">Zatím nebyly vylosovány týmy.</div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    {teams.map((tm) => (
                      <div key={tm.id} className={`rounded-2xl border p-4 space-y-2 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200'}`}>
                        <div className="flex justify-between items-center border-b pb-2 border-slate-800">
                          <h3 className="font-bold text-sm">{tm.name}</h3>
                          <span className="text-xs font-mono font-bold px-2 py-0.5 rounded-full bg-slate-800 text-amber-400">⭐ {tm.totalRating.toFixed(1)}</span>
                        </div>
                        <ul className="space-y-1 text-xs">
                          {tm.players.map(p => (
                            <li key={p.id} className="flex justify-between py-1 border-b border-slate-800/30"><span>{p.name}</span><span className="text-slate-400">⭐ {p.rating.toFixed(1)}</span></li>
                          ))}
                        </ul>
                      </div>
                    ))}
                  </div>
                )}
              </section>
            )}

            {/* TAB: ZÁPASY A ČASOMÍRA */}
            {activeTab === 'matches' && (
              <section className="space-y-4">
                {activeMatch ? (
                  <div className={`rounded-2xl border p-5 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                    
                    {/* Ovládání odpočtu */}
                    <div className="flex flex-col items-center justify-center gap-3 mb-5">
                      <div className="flex items-center gap-2">
                        <div className="p-1 rounded-xl border border-slate-800 bg-slate-950 flex gap-1 text-xs">
                          <button onClick={() => { setTimerMode('countdown'); setTimeLeft(240); setIsTimerRunning(false); setHasWhistled(false); }} className={`px-3 py-1 rounded-lg font-semibold ${timerMode === 'countdown' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>4 min</button>
                          <button onClick={() => { setTimerMode('stopwatch'); setIsTimerRunning(false); }} className={`px-3 py-1 rounded-lg font-semibold ${timerMode === 'stopwatch' ? 'bg-blue-600 text-white' : 'text-slate-400'}`}>Stopky</button>
                        </div>
                        <button onClick={() => { setSoundEnabled(!soundEnabled); if (!soundEnabled) sound.playBeep(true); }} className={`px-3 py-1.5 rounded-xl border text-xs font-semibold flex items-center gap-1.5 ${soundEnabled ? 'bg-emerald-950/40 border-emerald-800 text-emerald-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                          {soundEnabled ? <Volume2 className="w-3.5 h-3.5" /> : <VolumeX className="w-3.5 h-3.5" />}
                          <span>{soundEnabled ? 'ZAP' : 'VYP'}</span>
                        </button>
                      </div>

                      {/* Čas displej */}
                      <div className={`flex items-center gap-3 px-6 py-2.5 rounded-2xl border ${timerMode === 'countdown' && timeLeft === 0 ? 'bg-red-500/20 border-red-500 text-red-500 animate-bounce' : darkMode ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200'}`}>
                        <Timer className="w-5 h-5 text-blue-500" />
                        <span className="font-mono text-3xl sm:text-4xl font-extrabold">{timerMode === 'countdown' ? formatTime(timeLeft) : formatTime(secondsElapsed)}</span>
                        <div className="flex gap-1 ml-2">
                          <button onClick={() => { if (!isTimerRunning && soundEnabled) sound.playBeep(true); setIsTimerRunning(!isTimerRunning); }} className={`p-2 rounded-xl border ${isTimerRunning ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-emerald-600 text-white'}`}>
                            {isTimerRunning ? <Pause className="w-4 h-4" /> : <Play className="w-4 h-4 fill-white" />}
                          </button>
                          <button onClick={() => { setIsTimerRunning(false); setTimeLeft(240); setSecondsElapsed(0); setHasWhistled(false); }} className="p-2 rounded-xl border bg-slate-800 border-slate-700 text-slate-400"><RotateCcw className="w-4 h-4" /></button>
                        </div>
                      </div>
                    </div>

                    {/* Skóre */}
                    <div className="grid grid-cols-3 text-center gap-2 py-4 border-y border-slate-800">
                      <div>
                        <h3 className="font-bold text-sm sm:text-base">{activeMatch.teamAName}</h3>
                        <div className="flex justify-center gap-2 mt-2">
                          <button onClick={() => setMatches(matches.map(m => m.id === activeMatch.id ? { ...m, teamAScore: Math.max(0, m.teamAScore - 1) } : m))} className="w-8 h-8 rounded-lg bg-slate-800 text-white font-bold">-</button>
                          <span className="text-3xl font-mono font-extrabold">{activeMatch.teamAScore}</span>
                          <button onClick={() => setMatches(matches.map(m => m.id === activeMatch.id ? { ...m, teamAScore: m.teamAScore + 1 } : m))} className="w-8 h-8 rounded-lg bg-blue-600 text-white font-bold">+</button>
                        </div>
                      </div>
                      <div className="text-slate-500 font-mono text-sm font-bold pt-6">VS</div>
                      <div>
                        <h3 className="font-bold text-sm sm:text-base">{activeMatch.teamBName}</h3>
                        <div className="flex justify-center gap-2 mt-2">
                          <button onClick={() => setMatches(matches.map(m => m.id === activeMatch.id ? { ...m, teamBScore: Math.max(0, m.teamBScore - 1) } : m))} className="w-8 h-8 rounded-lg bg-slate-800 text-white font-bold">-</button>
                          <span className="text-3xl font-mono font-extrabold">{activeMatch.teamBScore}</span>
                          <button onClick={() => setMatches(matches.map(m => m.id === activeMatch.id ? { ...m, teamBScore: m.teamBScore + 1 } : m))} className="w-8 h-8 rounded-lg bg-blue-600 text-white font-bold">+</button>
                        </div>
                      </div>
                    </div>

                    <div className="mt-4 flex justify-between gap-3">
                      <span className="text-xs text-slate-400">{activeMatch.kickoffAt && `Výkop: ${formatDateTime(activeMatch.kickoffAt)}`}</span>
                      <button onClick={() => handleFinishMatch(activeMatch.id)} className="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold text-xs flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4" /> Ukončit zápas</button>
                    </div>
                  </div>
                ) : (
                  <div className="p-8 text-center rounded-2xl border border-slate-800">Žádný aktivní zápas.</div>
                )}

                {/* Historie zápasů */}
                <div className={`rounded-2xl border p-4 space-y-2 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                  <h3 className="font-bold text-sm flex gap-2"><Calendar className="w-4 h-4 text-blue-500" /> Rozpis & Historie</h3>
                  {matches.map(m => (
                    <div key={m.id} className={`p-3 rounded-xl border flex justify-between text-xs ${m.status === 'finished' ? 'bg-slate-950 border-slate-800' : 'bg-blue-950/20 border-blue-900/40'}`}>
                      <div>
                        <div className="font-semibold flex gap-2">
                          <span>#{m.matchNumber}:</span>
                          <span>{m.teamAName}</span>
                          <span className="font-mono px-1.5 py-0.5 rounded bg-slate-800 text-white">{m.teamAScore} : {m.teamBScore}</span>
                          <span>{m.teamBName}</span>
                        </div>
                        <div className="text-[11px] text-slate-400 flex gap-2 mt-0.5">
                          {m.kickoffAt && <span>Výkop: {formatDateTime(m.kickoffAt)}</span>}
                          {m.durationSeconds && <span>(Čas: {formatTime(m.durationSeconds)})</span>}
                          {m.restingTeamName && <span>• Pauza: {m.restingTeamName}</span>}
                        </div>
                      </div>
                      <button onClick={() => setMatches(matches.filter(x => x.id !== m.id))} className="p-1.5 text-slate-500 hover:text-red-400"><Trash2 className="w-3.5 h-3.5" /></button>
                    </div>
                  ))}
                </div>
              </section>
            )}

            {/* TAB: STATISTIKY */}
            {activeTab === 'stats' && (
              <section className={`rounded-2xl border p-5 ${darkMode ? 'bg-slate-900 border-slate-800' : 'bg-white border-slate-200 shadow-sm'}`}>
                <h3 className="font-bold text-base flex gap-2 mb-3"><Trophy className="w-5 h-5 text-amber-400" /> Tabulka hráčů</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs text-left">
                    <thead className="border-b border-slate-800 text-slate-400">
                      <tr>
                        <th className="py-2 px-3">Hráč</th>
                        <th className="py-2 px-2 text-center">Z</th>
                        <th className="py-2 px-2 text-center">V</th>
                        <th className="py-2 px-2 text-center">R</th>
                        <th className="py-2 px-2 text-center">P</th>
                        <th className="py-2 px-3 text-right">Winrate</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/40 font-mono">
                      {[...players].sort((a,b) => calculateWinrate(b.stats) - calculateWinrate(a.stats) || (b.stats?.wins || 0) - (a.stats?.wins || 0)).map((p, idx) => (
                        <tr key={p.id} className={idx === 0 ? 'font-bold text-amber-400' : ''}>
                          <td className="py-2.5 px-3 font-sans">{idx === 0 && '👑 '} {p.name}</td>
                          <td className="py-2.5 px-2 text-center">{p.stats?.matches || 0}</td>
                          <td className="py-2.5 px-2 text-center text-emerald-500">{p.stats?.wins || 0}</td>
                          <td className="py-2.5 px-2 text-center text-slate-400">{p.stats?.draws || 0}</td>
                          <td className="py-2.5 px-2 text-center text-rose-500">{p.stats?.losses || 0}</td>
                          <td className="py-2.5 px-3 text-right font-bold text-blue-500">{calculateWinrate(p.stats)} %</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </section>
            )}

            {/* MODAL SDÍLENÍ */}
            {isShareModalOpen && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
                <div className={`w-full max-w-md rounded-2xl border p-5 space-y-4 ${darkMode ? 'bg-slate-900 border-slate-800 text-white' : 'bg-white border-slate-200 text-slate-900'}`}>
                  <div className="flex justify-between items-center border-b pb-3 border-slate-800">
                    <h3 className="font-bold text-base flex items-center gap-2"><Share2 className="w-5 h-5 text-blue-500" /> Sdílet na WhatsApp</h3>
                    <button onClick={() => setIsShareModalOpen(false)} className="p-1 cursor-pointer"><X className="w-4 h-4 text-slate-400" /></button>
                  </div>
                  <button
                    onClick={() => {
                      const t = encodeURIComponent(`⚽ Friday Football:\n${window.location.href}`);
                      window.open(`https://api.whatsapp.com/send?text=${t}`, '_blank');
                    }}
                    className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs flex justify-center gap-2"
                  >
                    <Send className="w-4 h-4" /> Odeslat na WhatsApp
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Nastartování Reactu
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
