<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friday Football</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111827;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1f2937;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
}

button{
    background:#22c55e;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#16a34a;
}

input,select{
    background:#374151;
    color:white;
    border:none;
    border-radius:8px;
    padding:8px;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.player{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid #374151;
}

.team{
    background:#1f2937;
    border-radius:12px;
    padding:15px;
    margin-top:10px;
}

.hidden{
    display:none;
}
