<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Team Generator</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: auto;
    padding: 20px;
    background: #f3f3f3;
}

.card{
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 10px;
}

button{
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    background: #007aff;
    color: white;
    cursor: pointer;
}

input, select{
    padding: 8px;
}

.player{
    display: flex;
    justify-content: space-between;
    margin: 5px 0;
}

.team{
    background: white;
    border-radius: 10px;
    padding: 15px;
    margin-top: 10px;
}

.tabs{
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
}

.tab{
    background: #ddd;
    color: black;
}

.tab.active{
    background: #007aff;
    color: white;
}

.tab-content{
    display: none;
}

.tab-content.active{
    display: block;
}
</style>
</head>

<body>

<h1>⚽ Football Team Generator</h1>

<div class="tabs">
    <button id="tabPlayers" class="tab active"
        onclick="showTab('playersTab')">
        Hráči
    </button>

    <button id="tabTeams" class="tab"
        onclick="showTab('teamsTab')">
        Losování
    </button>
</div>

<!-- ZÁLOŽKA HRÁČI -->
<div id="playersTab" class="tab-content active">

    <div class="card">
        <h3>Přidat hráče</h3>

        <input id="name
