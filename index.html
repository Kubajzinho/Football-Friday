<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Team Generator</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f3f3f3;
}

.card{
    background:white;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:6px;
    background:#007aff;
    color:white;
    cursor:pointer;
}

input,select{
    padding:8px;
}

.player{
    display:flex;
    justify-content:space-between;
    margin:5px 0;
}

.team{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>⚽ Football Team Generator</h1>

<div class="card">

<h3>Přidat hráče</h3>

<input id="name" placeholder="Jméno">

<select id="rating">
<option>0</option>
<option>0.5</option>
<option>1</option>
<option>1.5</option>
<option>2</option>
<option>2.5</option>
<option>3</option>
<option>3.5</option>
<option>4</option>
<option>4.5</option>
<option selected>5</option>
</select>

<button onclick="addPlayer()">Přidat</button>

</div>

<div class="card">
<h3>Databáze hráčů</h3>
<div id="players"></div>
</div>

<div class="card">
<button onclick="generateTeams()">🎲 Vylosovat týmy</button>
</div>

<div id="teams"></div>

<script>

let players =
JSON.parse(localStorage.getItem("players")) || [];

function savePlayers(){
    localStorage.setItem(
        "players",
        JSON.stringify(players)
    );
}

function addPlayer(){

    let name =
    document.getElementById("name").value.trim();

    let rating =
    parseFloat(document.getElementById("rating").value);

    if(!name) return;

    players.push({
        name:name,
        rating:rating,
        active:false
    });

    savePlayers();
    renderPlayers();

    document.getElementById("name").value="";
}

function deletePlayer(index){

    if(confirm("Smazat hráče?")){
        players.splice(index,1);
        savePlayers();
        renderPlayers();
    }
}

function togglePlayer(index){

    players[index].active =
    !players[index].active;

    savePlayers();
}

function renderPlayers(){

    document.getElementById("players").innerHTML =
    players.map((p,i)=>`

    <div class="player">

        <span>
        <input
        type="checkbox"
        ${p.active ? "checked" : ""}
        onchange="togglePlayer(${i})">

        ${p.name}
        (Rating ${p.rating})
        </span>

        <button
        onclick="deletePlayer(${i})">
        Smazat
        </button>

    </div>

    `).join("");
}

function shuffle(array){

    const arr=[...array];

    for(let i=arr.length-1;i>0;i--){

        const j=Math.floor(
            Math.random()*(i+1)
        );

        [arr[i],arr[j]]=
        [arr[j],arr[i]];
    }

    return arr;
}

function generateTeams(){

    let active =
    players.filter(p=>p.active);

    let count = active.length;

    let teamCount = 0;

    if(count===6){
        teamCount=2;
    }
    else if(count===8){
        teamCount=2;
    }
    else if(count===9){
        teamCount=3;
    }
    else{
        alert(
        "Vyber přesně 6, 8 nebo 9 hráčů."
        );
        return;
    }

    active.sort(
        (a,b)=>b.rating-a.rating
    );

    let teams=[];

    for(let i=0;i<teamCount;i++){
        teams.push([]);
    }

    let totals =
    new Array(teamCount).fill(0);

    active.forEach(player=>{

        let minIndex = 0;

        for(let i=1;i<teamCount;i++){

            if(totals[i] < totals[minIndex]){
                minIndex=i;
            }
        }

        teams[minIndex].push(player);
        totals[minIndex]+=player.rating;
    });

    let html="<h2>Výsledek</h2>";

    teams.forEach((team,index)=>{

        let total =
        team.reduce(
        (sum,p)=>sum+p.rating,0);

        html+=`
        <div class="team">
        <h3>Tým ${String.fromCharCode(65+index)}
        (${total.toFixed(1)})</h3>
        <ul>
        ${team.map(
            p=>`<li>${p.name} (${p.rating})</li>`
        ).join("")}
        </ul>
        </div>
        `;
    });

    document.getElementById("teams").innerHTML =
    html;
}

renderPlayers();

</script>

</body>
</html>
