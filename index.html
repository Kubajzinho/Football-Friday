<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friday Football</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background: #111827;
    color: #f9fafb;
}

.card {
    background: #1f2937;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #22c55e;
    color: white;
    font-weight: bold;
}

button:hover {
    background: #16a34a;
}

input {
    padding: 8px;
    margin-right: 5px;
    background: #374151;
    color: white;
    border: none;
    border-radius: 8px;
}

.player {
    display: flex;
    justify-content: space-between;
    margin: 8px 0;
}

.team {
    background: #1f2937;
    padding: 15px;
    border-radius: 12px;
    width: 45%;
}

.teams {
    display: flex;
    justify-content: space-between;
    gap: 20px;
}
</style>
</head>

<body>

<h1>⚽ Friday Football</h1>

<div class="card">
    <h3>Přidat hráče</h3>

    <input id="name" placeholder="Jméno">
    <input id="rating" type="number" placeholder="Rating">
    <button onclick="addPlayer()">Přidat</button>
</div>

<div class="card">
    <h3>Hráči</h3>
    <div id="players"></div>
</div>

<div class="card">
    <button onclick="generateTeams()">Rozdělit týmy</button>
</div>

<div id="result"></div>

<script>

let players = JSON.parse(localStorage.getItem("players")) || [];

function savePlayers() {
    localStorage.setItem("players", JSON.stringify(players));
}

function addPlayer() {
    const name = document.getElementById("name").value;
    const rating = Number(document.getElementById("rating").value);

    if (!name || !rating) return;

    players.push({
        name,
        rating,
        present: true
    });

    savePlayers();
    renderPlayers();

    document.getElementById("name").value = "";
    document.getElementById("rating").value = "";
}

function removePlayer(index) {
    players.splice(index, 1);
    savePlayers();
    renderPlayers();
}

function renderPlayers() {
    const container = document.getElementById("players");

    container.innerHTML = players.map((p, i) => `
        <div class="player">
            <span>
                <input type="checkbox"
                    ${p.present ? "checked" : ""}
                    onchange="togglePresent(${i})">

                ${p.name} (${p.rating})
            </span>

            <button onclick="removePlayer(${i})">
                Smazat
            </button>
        </div>
    `).join("");
}

function togglePresent(i){
    players[i].present = !players[i].present;
    savePlayers();
}

function generateTeams() {

    const present = players.filter(p => p.present);

    if (present.length !== 6) {
        alert("Pro tuto verzi vyber přesně 6 hráčů.");
        return;
